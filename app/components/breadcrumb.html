<!-- Sistema de breadcrumbs -->
<nav aria-label="Breadcrumb" class="mb-6">
    <ol class="flex items-center space-x-1 text-sm" x-data="breadcrumbSystem()">
        <!-- Home link -->
        <li>
            <a href="/web/dashboard" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span class="sr-only">Home</span>
            </a>
            <span class="mx-2 text-gray-400">/</span>
        </li>
        
        <!-- Breadcrumb items -->
        <template x-for="(item, index) in breadcrumbs" :key="index">
            <li>
                <!-- Last item (current page) -->
                <span x-show="index === breadcrumbs.length - 1" class="text-gray-900 dark:text-white font-medium" x-text="item.name">
                    <span class="sr-only"> (página atual)</span>
                </span>
                
                <!-- Previous items -->
                <template x-show="index < breadcrumbs.length - 1">
                    <a :href="item.url" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200" x-text="item.name"></a>
                    <span class="mx-2 text-gray-400">/</span>
                </template>
            </li>
        </template>
    </ol>
</nav>

<script>
function breadcrumbSystem() {
    return {
        breadcrumbs: [
            { name: 'Dashboard', url: '/web/dashboard' }
        ],
        
        addBreadcrumb(name, url = null) {
            this.breadcrumbs.push({ name, url });
        },
        
        setBreadcrumbs(breadcrumbs) {
            this.breadcrumbs = breadcrumbs;
        },
        
        clear() {
            this.breadcrumbs = [{ name: 'Dashboard', url: '/web/dashboard' }];
        },
        
        // Common breadcrumb helpers
        setFromPath(path) {
            const parts = path.split('/').filter(part => part);
            this.breadcrumbs = [{ name: 'Dashboard', url: '/web/dashboard' }];
            
            let currentPath = '/web/dashboard';
            parts.forEach((part, index) => {
                currentPath += '/' + part;
                const name = part.charAt(0).toUpperCase() + part.slice(1).replace(/-/g, ' ');
                this.breadcrumbs.push({
                    name: name,
                    url: index === parts.length - 1 ? null : currentPath
                });
            });
        }
    }
}
</script>
