<!-- Componente Card Genérico Reutilizável -->
<div class="card {{ card_classes || 'bg-white dark:bg-gray-800 shadow-md rounded-lg overflow-hidden' }}" x-data="cardData()">
    
    <!-- Título do Card (opcional) -->
    <div x-show="title" class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100" x-text="title || 'Título do Card'"></h3>
    </div>
    
    <!-- Descrição do Card (opcional) -->
    <div x-show="description" class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <p class="text-sm text-gray-600 dark:text-gray-400" x-text="description || ''"></p>
    </div>
    
    <!-- Conteúdo principal do Card -->
    <div class="px-6 py-4">
        <slot name="content">
            <!-- Conteúdo padrão quando não há slot -->
            <div class="text-gray-500 dark:text-gray-400">
                <p>Conteúdo do card</p>
            </div>
        </slot>
    </div>
    
    <!-- Rodapé do Card (opcional) -->
    <div x-show="actions || footer" class="px-6 py-4 border-t border-gray-200 dark:border-gray-700">
        <div class="flex items-center justify-between">
            <!-- Conteúdo do rodapé -->
            <div x-show="footer" x-html="footer"></div>
            
            <!-- Ações do card -->
            <div class="flex items-center gap-2" x-show="actions">
                <slot name="actions">
                    <!-- Ações padrão quando não há slot -->
                    <button type="button" @click="primaryAction"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition flex items-center gap-2 text-sm"
                            :disabled="disabled || loading">
                        <svg x-show="loading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span x-text="primaryButtonText || 'Ação Principal'"></span>
                    </button>
                </slot>
            </div>
        </div>
    </div>
    
    <!-- Estado de carregamento sobreposto -->
    <div x-show="loading" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-lg">
            <div class="flex items-center gap-2">
                <svg class="animate-spin h-5 w-5 text-blue-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-gray-700 dark:text-gray-300" x-text="loadingText || 'Carregando...'"></span>
            </div>
        </div>
    </div>
</div>

<script>
function cardData() {
    return {
        title: '',
        description: '',
        footer: '',
        primaryButtonText: '',
        loading: false,
        disabled: false,
        
        primaryAction() {
            if (!this.disabled && !this.loading && this.primaryActionEvent) {
                if (window[this.primaryActionEvent]) {
                    window[this.primaryActionEvent]();
                }
            }
        },
        
        startLoading(text = 'Carregando...') {
            this.loading = true;
            this.loadingText = text;
        },
        
        stopLoading() {
            this.loading = false;
        },
        
        setDisabled(disabled = true) {
            this.disabled = disabled;
        }
    };
}
</script>
