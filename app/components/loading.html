<!-- Sistema de loading global -->
<div x-data="loadingSystem()" 
     class="fixed inset-0 z-50 flex items-center justify-center">
    
    <!-- Loading overlay -->
    <div x-show="isLoading" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm">
        
        <!-- Loading content -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 min-w-[200px]">
            <div class="flex items-center justify-center">
                <svg class="animate-spin h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="ml-3 text-secondary" x-text="loadingText">Carregando...</span>
            </div>
        </div>
    </div>
    
    <!-- Page content with overlay -->
    <div class="relative z-10">
        <!-- Page content here -->
        <slot></slot>
    </div>
</div>

<script>
function loadingSystem() {
    return {
        isLoading: false,
        loadingText: 'Carregando...',
        
        start(text = 'Carregando...') {
            this.isLoading = true;
            this.loadingText = text;
            
            // Auto-stop after 10 seconds (prevent infinite loading)
            setTimeout(() => {
                if (this.isLoading) {
                    this.stop();
                }
            }, 10000);
        },
        
        stop() {
            this.isLoading = false;
        },
        
        // Convenience methods for common scenarios
        startPage() {
            this.start('Carregando página...');
        },
        
        startForm() {
            this.start('Salvando...');
        },
        
        startSearch() {
            this.start('Buscando...');
        },
        
        startUpload() {
            this.start('Enviando...');
        },
        
        startDownload() {
            this.start('Baixando...');
        },
        
        startDelete() {
            this.start('Excluindo...');
        }
    }
}
</script>
