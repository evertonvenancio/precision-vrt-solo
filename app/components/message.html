<!-- Sistema de mensagens -->
<div x-data="messageSystem()" 
     x-init="$watch('messages', () => { if (messages.length > 0) showCurrentMessage() })"
     x-show="messages.length > 0"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 transform translate-y-2"
     x-transition:enter-end="opacity-100 transform translate-y-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 transform translate-y-0"
     x-transition:leave-end="opacity-0 transform translate-y-2"
     class="fixed top-20 right-4 z-50 space-y-2 max-w-sm">
    
    <!-- Individual messages -->
    <template x-for="(message, index) in messages" :key="index">
        <div :class="{
            'bg-green-50 border-green-200 text-green-700': message.type === 'success',
            'bg-blue-50 border-blue-200 text-blue-700': message.type === 'info',
            'bg-yellow-50 border-yellow-200 text-yellow-700': message.type === 'warning',
            'bg-red-50 border-red-200 text-red-700': message.type === 'error'
        }" 
             class="border-l-4 p-4 rounded-lg shadow-lg"
             x-show="message.show"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 transform translate-y-2"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 transform translate-y-0"
             x-transition:leave-end="opacity-0 transform translate-y-2">
            
            <div class="flex items-center">
                <!-- Icon -->
                <svg class="w-6 h-6 mr-3 flex-shrink-0" :fill="message.type === 'success' ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24">
                    <path x-show="message.type === 'success'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    <path x-show="message.type === 'error'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    <path x-show="message.type === 'info'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1m-1-2h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    <path x-show="message.type === 'warning'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                
                <!-- Content -->
                <div class="flex-1">
                    <h4 class="font-medium text-sm" x-text="message.title"></h4>
                    <p class="text-sm mt-1" x-text="message.text"></p>
                </div>
                
                <!-- Close button -->
                <button type="button" @click="closeMessage(index)" class="ml-4 flex-shrink-0 text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </template>
</div>

<script>
function messageSystem() {
    return {
        messages: [],
        
        showCurrentMessage() {
            if (this.messages.length > 0 && !this.messages[0].show) {
                this.messages[0].show = true;
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    this.closeMessage(0);
                }, 5000);
            }
        },
        
        addMessage(type, title, text, duration = 5000) {
            const message = {
                type,
                title,
                text,
                show: false,
                duration
            };
            
            this.messages.push(message);
        },
        
        closeMessage(index) {
            this.messages[index].show = false;
            setTimeout(() => {
                this.messages.splice(index, 1);
            }, 200);
        },
        
        // Convenience methods
        success(title, text) {
            this.addMessage('success', title, text);
        },
        
        error(title, text) {
            this.addMessage('error', title, text);
        },
        
        warning(title, text) {
            this.addMessage('warning', title, text);
        },
        
        info(title, text) {
            this.addMessage('info', title, text);
        }
    }
}
</script>
