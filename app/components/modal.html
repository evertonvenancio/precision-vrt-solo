<!-- Modais padronizados -->
<div x-show="show" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-y-auto"
     @click.self="close()">
    
    <!-- Background overlay -->
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="fixed inset-0 transition-opacity" aria-hidden="true">
            <div class="absolute inset-0 bg-gray-500 bg-opacity-75" @click="close()"></div>
        </div>
        
        <!-- Modal content -->
        <div class="relative bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-lg w-full transform transition-all"
             x-show="show"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 scale-100"
             x-transition:leave-end="opacity-0 scale-95">
            
            <!-- Modal header -->
            <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
                <h3 class="text-lg font-medium text-gray-900 dark:text-white" x-text="title">Título do Modal</h3>
                <button type="button" @click="close()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Modal body -->
            <div class="p-6">
                <div class="mb-4">
                    <slot></slot>
                </div>
                
                <!-- Mensagens -->
                <div x-show="message" 
                     x-transition:enter="transition ease-out duration-300"
                     x-transition:enter-start="opacity-0 transform translate-y-2"
                     x-transition:enter-end="opacity-100 transform translate-y-0"
                     :class="{
                         'bg-red-50 border-red-200 text-red-700': messageType === 'error',
                         'bg-blue-50 border-blue-200 text-blue-700': messageType === 'info',
                         'bg-green-50 border-green-200 text-green-700': messageType === 'success',
                         'bg-yellow-50 border-yellow-200 text-yellow-700': messageType === 'warning'
                     }" 
                     class="border-l-4 p-4 rounded mb-4">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 mr-2" :fill="messageType === 'error' ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24">
                            <path x-show="messageType === 'error'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span class="text-sm" x-text="message"></span>
                    <!-- Usar sistema de mensagens global -->
                    <script>
                    if (window.messageSystem) {
                        window.messageSystem[messageType](title || 'Mensagem', message);
                    }
                    </script>
                    </div>
                </div>
            </div>
            
            <!-- Modal footer -->
            <div class="flex justify-end p-6 border-t border-gray-200 dark:border-gray-700 space-x-3">
                <button type="button" @click="close()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors" x-text="cancelText || 'Cancelar'">Cancelar</button>
                <button type="button" @click="confirm()" :disabled="loading" class="btn-primary px-4 py-2 rounded-lg font-medium transition-colors hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" :class="{'opacity-50 cursor-not-allowed': loading}" x-text="confirmText || 'Confirmar'">
                    <span x-show="!loading">Confirmar</span>
                    <span x-show="loading" class="flex items-center">
                        <svg class="animate-spin -ml-1 mr-2 h-4 w-4" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Carregando...
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>
