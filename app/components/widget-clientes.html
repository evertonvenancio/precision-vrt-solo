<!-- Componente Widget Clientes - Utiliza Card.html e Table.html -->
<div class="widget-content" x-data="clientesWidget()">
    
    <!-- Loading State já gerenciado pelo card pai -->
    
    <!-- Empty State já gerenciado pelo card pai -->
    
    <!-- Error State já gerenciado pelo card pai -->
    
    <!-- No Permission State já gerenciado pelo card pai -->
    
    <!-- Loaded Content -->
    <div x-show="widget.state === 'loaded'">
        
        <!-- Estatísticas Gerais com Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            
            <!-- Card Total Clientes -->
            <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm">Total de Clientes</p>
                        <p class="text-2xl font-bold" x-text="widgetData.total || 0"></p>
                        <p class="text-blue-100 text-xs mt-1">
                            <span x-text="widgetData.trend === 'up' ? '↗️' : widgetData.trend === 'down' ? '↘️' : '→'"></span>
                            <span x-text="widgetData.recent ? `+${widgetData.recent}` : 'Estável'"></span>
                        </p>
                    </div>
                    <div class="bg-white/20 rounded-lg p-2">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Clientes Recent -->
            <div class="bg-gradient-to-r from-green-500 to-green-600 text-white rounded-lg p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-green-100 text-sm">Novos Este Mês</p>
                        <p class="text-2xl font-bold" x-text="widgetData.recent || 0"></p>
                        <p class="text-green-100 text-xs mt-1">Novos clientes</p>
                    </div>
                    <div class="bg-white/20 rounded-lg p-2">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
        </div>
        
        <!-- Lista de Clientes -->
        <div class="space-y-3">
            <h4 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">Clientes Recentes</h4>
            
            <!-- Item de Cliente -->
            <template x-for="cliente in widgetData.data" :key="cliente.name">
                <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900 rounded-full flex items-center justify-center">
                            <span class="text-blue-600 dark:text-blue-300 font-semibold text-sm" x-text="cliente.name.charAt(0)"></span>
                        </div>
                        <div>
                            <p class="font-medium text-gray-900 dark:text-white" x-text="cliente.name"></p>
                            <p class="text-xs text-gray-500 dark:text-gray-400">R$ <span x-text="cliente.value.toLocaleString()"></span></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span :class="{
                            'bg-green-100 text-green-800': cliente.change > 0,
                            'bg-red-100 text-red-800': cliente.change < 0,
                            'bg-gray-100 text-gray-800': cliente.change === 0
                        }" class="px-2 py-1 rounded-full text-xs font-medium">
                            <span x-text="cliente.change > 0 ? '+' : ''"></span><span x-text="cliente.change"></span>%
                        </span>
                        <button class="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </template>
            
            <!-- Sem dados -->
            <div x-show="!widgetData.data || widgetData.data.length === 0" class="text-center py-6">
                <p class="text-gray-500 dark:text-gray-400 text-sm">Nenhum cliente encontrado</p>
            </div>
        </div>
        
        <!-- Botão para ver todos -->
        <div class="mt-4 text-center">
            <button class="text-sm text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 font-medium">
                Ver todos os clientes →
            </button>
        </div>
        
    </div>
</div>

<script>
function clientesWidget() {
    return {
        widget,
        widgetData: {
            total: 0,
            recent: 0,
            trend: 'stable',
            data: []
        },
        
        init() {
            // Carregar dados reais do backend
            this.loadClientesData();
        },
        
        async loadClientesData() {
            try {
                const response = await fetch('/api/v1/dashboard/widgets/clientes', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    this.widgetData = data.data;
                    widget.state = 'loaded';
                } else {
                    widget.state = 'error';
                    widget.errorMessage = 'Não foi possível carregar os dados dos clientes';
                }
            } catch (error) {
                widget.state = 'error';
                widget.errorMessage = 'Erro ao conectar com o servidor';
                console.error('Error loading clientes data:', error);
            }
        }
    }
}
</script>
