<!-- Componente Widget Fazendas - Utiliza Card.html -->
<div class="widget-content" x-data="fazendasWidget()">
    
    <!-- Loading State já gerenciado pelo card pai -->
    
    <!-- Empty State já gerenciado pelo card pai -->
    
    <!-- Error State já gerenciado pelo card pai -->
    
    <!-- No Permission State já gerenciado pelo card pai -->
    
    <!-- Loaded Content -->
    <div x-show="widget.state === 'loaded'">
        
        <!-- Estatísticas Gerais -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
            
            <!-- Card Total Fazendas -->
            <div class="bg-gradient-to-r from-green-500 to-green-600 text-white rounded-lg p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-green-100 text-sm">Total de Fazendas</p>
                        <p class="text-2xl font-bold" x-text="widgetData.total || 0"></p>
                        <p class="text-green-100 text-xs mt-1">Propriedades</p>
                    </div>
                    <div class="bg-white/20 rounded-lg p-2">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Área Total -->
            <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-blue-100 text-sm">Área Total</p>
                        <p class="text-xl font-bold" x-text="widgetData.area_total || '0'"></p>
                        <p class="text-blue-100 text-xs mt-1">Hectares</p>
                    </div>
                    <div class="bg-white/20 rounded-lg p-2">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 7m0 13V7m0 0L9 7"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Processadas -->
            <div class="bg-gradient-to-r from-orange-500 to-orange-600 text-white rounded-lg p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-orange-100 text-sm">Processadas</p>
                        <p class="text-2xl font-bold" x-text="widgetData.processadas || 0"></p>
                        <p class="text-orange-100 text-xs mt-1">Esta semana</p>
                    </div>
                    <div class="bg-white/20 rounded-lg p-2">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
        </div>
        
        <!-- Lista de Fazendas -->
        <div class="space-y-3">
            <h4 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-3">Fazendas em Processamento</h4>
            
            <template x-for="fazenda in widgetData.data" :key="fazenda.name">
                <div class="p-3 border border-gray-200 dark:border-gray-600 rounded-lg">
                    <div class="flex items-center justify-between mb-2">
                        <h5 class="font-medium text-gray-900 dark:text-white" x-text="fazenda.name"></h5>
                        <span :class="{
                            'bg-green-100 text-green-800': fazenda.status === 'concluído',
                            'bg-yellow-100 text-yellow-800': fazenda.status === 'processando',
                            'bg-blue-100 text-blue-800': fazenda.status === 'agendado'
                        }" class="px-2 py-1 rounded-full text-xs font-medium">
                            <span x-text="fazenda.status"></span>
                        </span>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-gray-500 dark:text-gray-400">
                            <span x-text="fazenda.area"></span> ha
                        </span>
                        <div class="flex items-center space-x-2">
                            <div class="w-20 bg-gray-200 dark:bg-gray-600 rounded-full h-2">
                                <div :class="{
                                    'bg-green-500': fazenda.status === 'concluído',
                                    'bg-yellow-500': fazenda.status === 'processando',
                                    'bg-blue-500': fazenda.status === 'agendado'
                                }" class="h-2 rounded-full" :style="`width: ${fazenda.status === 'concluído' ? '100%' : fazenda.status === 'processando' ? '75%' : '0%'}`"></div>
                            </div>
                            <span class="text-gray-500 dark:text-gray-400 text-xs" x-text="fazenda.status === 'concluído' ? '100%' : fazenda.status === 'processando' ? '75%' : '0%'"></span>
                        </div>
                    </div>
                </div>
            </template>
            
            <!-- Sem dados -->
            <div x-show="!widgetData.data || widgetData.data.length === 0" class="text-center py-6">
                <p class="text-gray-500 dark:text-gray-400 text-sm">Nenhuma fazenda em processamento</p>
            </div>
        </div>
        
        <!-- Botão para ver detalhes -->
        <div class="mt-4 text-center">
            <button class="text-sm text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 font-medium">
                Gerenciar fazendas →
            </button>
        </div>
        
    </div>
</div>

<script>
function fazendasWidget() {
    return {
        widget,
        widgetData: {
            total: 0,
            area_total: '0',
            processadas: 0,
            trend: 'stable',
            data: []
        },
        
        init() {
            // Carregar dados reais do backend
            this.loadFazendasData();
        },
        
        async loadFazendasData() {
            try {
                const response = await fetch('/api/v1/dashboard/widgets/fazendas', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    this.widgetData = data.data;
                    widget.state = 'loaded';
                } else {
                    widget.state = 'error';
                    widget.errorMessage = 'Não foi possível carregar os dados das fazendas';
                }
            } catch (error) {
                widget.state = 'error';
                widget.errorMessage = 'Erro ao conectar com o servidor';
                console.error('Error loading fazendas data:', error);
            }
        }
    }
}
</script>
