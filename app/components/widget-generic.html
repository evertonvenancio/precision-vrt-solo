<!-- Componente Widget Genérico - Utiliza Card.html -->
<div class="widget-content" x-data="genericWidget()">
    
    <!-- Loading State já gerenciado pelo card pai -->
    
    <!-- Empty State já gerenciado pelo card pai -->
    
    <!-- Error State já gerenciado pelo card pai -->
    
    <!-- No Permission State já gerenciado pelo card pai -->
    
    <!-- Loaded Content -->
    <div x-show="widget.state === 'loaded'">
        
        <!-- Header com título e descrição -->
        <div class="mb-4">
            <h4 class="text-lg font-semibold text-gray-900 dark:text-white mb-1" x-text="widget.title"></h4>
            <p class="text-sm text-gray-500 dark:text-gray-400" x-text="widget.description"></p>
        </div>
        
        <!-- Conteúdo padrão para widgets sem implementação específica -->
        <div class="text-center py-8">
            <div class="mb-4">
                <div class="w-16 h-16 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center mx-auto">
                    <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path :x-text="widget.icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                    </svg>
                </div>
            </div>
            <h5 class="text-lg font-medium text-gray-700 dark:text-gray-300 mb-2">Widget <span x-text="widget.title"></span></h5>
            <p class="text-gray-500 dark:text-gray-400 text-sm mb-4">
                Este widget será implementado com dados reais em breve.
            </p>
            
            <!-- Placeholder para dados futuros -->
            <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 text-left">
                <h6 class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Informações disponíveis:</h6>
                <ul class="text-xs text-gray-500 dark:text-gray-400 space-y-1">
                    <li>• Total: <span x-text="widget.id === 'atividades' ? '28' : widget.id === 'agenda' ? '6' : '0'"></span></li>
                    <li>• Ativos: <span x-text="widget.id === 'atividades' ? '4' : widget.id === 'agenda' ? '2' : '0'"></span></li>
                    <li>• Status: <span x-text="widget.trend === 'up' ? 'Crescente' : widget.trend === 'down' ? 'Decrescente' : 'Estável'"></span></li>
                </ul>
            </div>
        </div>
        
        <!-- Botão de ação -->
        <div class="mt-4 flex justify-center">
            <button class="text-sm text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 font-medium">
                Configurar widget →
            </button>
        </div>
        
    </div>
</div>

<script>
function genericWidget() {
    return {
        widget,
        widgetData: {
            total: 0,
            active: 0,
            trend: 'stable',
            data: []
        },
        
        init() {
            // Carregar dados básicos para o widget genérico
            this.loadGenericData();
        },
        
        async loadGenericData() {
            try {
                // Tenta carregar dados específicos do backend
                const response = await fetch(`/api/v1/dashboard/widgets/${widget.id}`, {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    // Se tiver dados específicos, processar aqui
                    this.widgetData = data.data || {
                        total: widget.id === 'atividades' ? 28 : widget.id === 'agenda' ? 6 : 0,
                        active: widget.id === 'atividades' ? 4 : widget.id === 'agenda' ? 2 : 0,
                        trend: widget.trend || 'stable',
                        data: []
                    };
                    widget.state = 'loaded';
                } else {
                    // Se não tiver endpoint específico, manter estado genérico
                    this.widgetData = {
                        total: widget.id === 'atividades' ? 28 : widget.id === 'agenda' ? 6 : 0,
                        active: widget.id === 'atividades' ? 4 : widget.id === 'agenda' ? 2 : 0,
                        trend: widget.trend || 'stable',
                        data: []
                    };
                    widget.state = 'loaded';
                }
            } catch (error) {
                // Erro de conexão - mostrar estado genérico
                this.widgetData = {
                    total: widget.id === 'atividades' ? 28 : widget.id === 'agenda' ? 6 : 0,
                    active: widget.id === 'atividades' ? 4 : widget.id === 'agenda' ? 2 : 0,
                    trend: widget.trend || 'stable',
                    data: []
                };
                widget.state = 'loaded';
                console.log(`Widget ${widget.id} sem dados específicos disponíveis`);
            }
        }
    }
}
</script>
