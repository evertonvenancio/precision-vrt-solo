{# Dynamic RBAC Sidebar Component #}
{# This is included by base.html and uses filter_menu/has_permission template helpers #}

<nav class="flex-1 overflow-y-auto py-3 px-2 space-y-1">
    {% for group in filter_menu(SIDEBAR_MENU_STRUCTURE, permissoes) %}
    <div class="space-y-0.5 relative">
        <div class="px-3 py-1.5 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider border-b border-gray-100 dark:border-gray-700 mb-1">
            {{ group.group }}
        </div>
        {% for item in group.items %}
        <a href="{{ item.url }}"
           class="block px-3 py-2 text-sm rounded-md transition-colors"
           :class="isActive('{{ item.url }}') ? 'text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-900/20 font-medium' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700/40'">
            {{ item.label }}
        </a>
        {% endfor %}
    </div>
    {% endfor %}
</nav>
