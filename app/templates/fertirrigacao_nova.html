{% extends "base.html" %}

{% block title %}Nova Fertirrigação{% endblock %}

{% block content %}
<div class="p-8">
    <h1 class="text-2xl font-bold mb-4">Nova Fertirrigação</h1>
    <p class="text-gray-500 dark:text-gray-400">Cálculo de recomendação de fertirrigação</p>
    <form class="grid grid-cols-1 gap-4 max-w-2xl">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Cultura</label>
            <select class="mt-1 block w-full rounded border dark:border-gray-400">
                <option>Soja</option>
                <option>Milho</option>
                <option>Trigo</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Dose recomendada</label>
            <input type="number" class="mt-1 block w-full rounded border dark:border-gray-400" placeholder="kg/ha">
        </div>
        <button type="submit" class="mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Calcular</button>
    </form>
</div>
{% endblock %}
