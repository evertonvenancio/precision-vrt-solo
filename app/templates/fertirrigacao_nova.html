{% extends "base.html" %}
{% import "components/macros.html" as macros %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    {{ macros.header_pagina(titulo, "Cálculo de recomendação de fertirrigação.") }}

    <div class="card mt-6 max-w-2xl p-6">
        <form action="/web/fertirrigacao/processar" method="POST" enctype="multipart/form-data" class="space-y-4">

            <div>
                <label class="block text-sm font-medium mb-1">Arquivo de Dados de Irrigação (.csv</label>
                <input type="file" name="arquivo_irrigacao" accept=".csv" required
                       class="w-full rounded border-gray-300 dark:bg-gray-700">
           </div>

            <div>
                <label class="block text-sm font-medium mb-1">Arquivo de Fertilizante (opcional, .csv</label>
                <input type="file" name="arquivo_fertilizante" accept=".csv"
                       class="w-full rounded border-gray-300 dark:bg-gray-700">
           </div>

            <div>
                <label class="block text-sm font-medium mb-1">Cultura</label>
                <select name="cultura" class="w-full rounded border-gray-300 dark:bg-gray-700">
                    <option value="">Selecione</option>
                    <option value="soja">Soja</option>
                    <option value="milho">Milho</option>
                    <option value="trigo">Trigo</option>
               </select>
           </div>

            <div class="pt-4 flex justify-end gap-3">
                <a href="/web/fertirrigacao" class="px-4 py-2 text-gray-500">Cancelar</a>
                <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded-md font-bold hover:bg-green-700">
                    Calcular Fertirrigação
               </button>
           </div>
       </form>
   </div>
</div>
{% endblock %}
