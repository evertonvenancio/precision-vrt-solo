{% extends "base.html" %}

{% block title %}Novo Monitoramento{% endblock %}

{% block content %}
<div class="p-8">
    <h1 class="text-2xl font-bold mb-4">Novo Monitoramento</h1>
    <p class="text-gray-500 dark:text-gray-400">Iniciar novo monitoramento de safra</p>
    <form class="grid grid-cols-1 gap-4 max-w-2xl">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Tipo de análise</label>
            <select class="mt-1 block w-full rounded border dark:border-gray-400">
                <option>Comparativo de imagens</option>
                <option>Alertas de estresse</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Período inicial</label>
            <input type="date" class="mt-1 block w-full rounded border dark:border-gray-400">
        </div>
        <button type="submit" class="mt-4 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4">Iniciar</button>
    </form>
</div>
{% endblock %}
