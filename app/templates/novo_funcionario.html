{% extends "base.html" %}

{% block title %}Cadastro de Funcionário{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">Cadastro de Funcionário</h1>

    <form method="POST" action="/equipe/novo-funcionario" class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-6 space-y-6">
        <!-- Dados Pessoais -->
        <div>
            <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-4">Dados Pessoais</h3>
            <div class="space-y-5">
                <div>
                    <label for="nome" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required
                           class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="cpf" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">CPF</label>
                        <input type="text" id="cpf" name="cpf" required
                               class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                    </div>
                    <div>
                        <label for="cargo" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Cargo</label>
                        <input type="text" id="cargo" name="cargo" required
                               class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label for="telefone" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Telefone</label>
                        <input type="text" id="telefone" name="telefone" required
                               class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">E-mail</label>
                        <input type="email" id="email" name="email" required
                               class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                    </div>
                </div>

                <div>
                    <label for="comissao_percentual" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Comissão %</label>
                    <input type="number" id="comissao_percentual" name="comissao_percentual" step="0.01" min="0" max="100" value="0"
                           class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                </div>
            </div>
        </div>

        <!-- Acesso ao Sistema -->
        <div class="pt-4 border-t border-gray-100 dark:border-gray-700">
            <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-4">Acesso ao Sistema</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label for="login" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Login</label>
                    <input type="text" id="login" name="login" required
                           class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                </div>
                <div>
                    <label for="senha" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Senha</label>
                    <input type="password" id="senha" name="senha" required
                           class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                </div>
            </div>
        </div>

        <!-- Botões -->
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
            <a href="/equipe"
               class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded transition">
                Cancelar
            </a>
            <button type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition">
                Salvar Funcionário
            </button>
        </div>
    </form>
</div>
{% endblock %}
