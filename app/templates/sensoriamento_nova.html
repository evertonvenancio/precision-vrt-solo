{% extends "base.html" %}

{% block title %}Novo Sensoriamento{% endblock %}

{% block content %}
<div class="p-8">
    <h1 class="text-2xl font-bold mb-4">Novo Sensoriamento</h1>
    <p class="text-gray-500 dark:text-gray-400">Novo processamento de dados sensoriais</p>
    <form class="grid grid-cols-1 gap-4 max-w-2xl">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Fonte de dados</label>
            <select class="mt-1 block w-full rounded border dark:border-gray-400">
                <option>Satélite Sentinel-2</option>
                <option>Drone</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Período</label>
            <input type="date" class="mt-1 block w-full rounded border dark:border-gray-400">
        </div>
        <button type="submit" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4">Processar</button>
    </form>
</div>
{% endblock %}
