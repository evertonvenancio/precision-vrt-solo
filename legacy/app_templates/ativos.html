{# extends "base.html" #}

{% extends 'base.html' %}


        <!-- Componentes Globais -->
        {% include "components/card.html" %}
        {% include "components/button.html" %}
        {% include "components/table.html" %}
        {% include "components/loading.html" %}
        {% include "components/message.html" %}
        {% include "components/empty-state.html" %}
        
<script>
function pageData() {
    return {
        pageTitle: 'Ativos',
        pageDescription: 'Gestão de Ativos e Patrimônio - Controle de bens, depreciação e vida útil',
        breadcrumbs: [
            { name: 'Dashboard', url: '/dashboard' },
            { name: 'Ativos', url: '#' }
        ],
        pageContent: `
<div class="h-full flex flex-col" x-data="pageData()">
    <!-- CABEÇALHO FIXO -->
    <div class="flex-shrink-0 px-8 pt-6 pb-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Gestão de Ativos e Patrimônio</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Gestão completa de ativos patrimoniais com controle de depreciação e vida útil.</p>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Gestão completa de ativos patrimoniais com controle de depreciação e vida útil.</p>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Controle de bens, depreciação e vida útil.</p>
            </div>
            <a href="/ativos/novo"
               class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition flex items-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Novo Ativo
            </a>
        </div>
    </div>

    <!-- CENTRO SCROLLÁVEL -->
    <div class="flex-1 overflow-y-auto p-8">
        <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <div class="overflow-x-auto">
            \1
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-700 text-gray-500 dark:text-gray-300 text-xs font-medium uppercase tracking-wider">
                            <th class="px-6 py-3">Nome do Bem</th>
                            <th class="px-6 py-3">Categoria</th>
                            <th class="px-6 py-3">Valor Aquisição</th>
                            <th class="px-6 py-3">Vida Útil (anos)</th>
                            <th class="px-6 py-3">Depreciação Mensal (R$)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                        {% for ativo in ativos %}
                        <tr class="hover:bg-green-50 dark:hover:bg-gray-700/30 transition">
                            <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100 font-medium">{{ ativo.nome_bem }}</td>
                            <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100">{{ ativo.categoria }}</td>
                            <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100 font-mono">R$ {{ "%.2f"|format(ativo.valor_aquisicao) }}</td>
                            <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100">{{ ativo.vida_util_anos }}</td>
                            <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100 font-mono">R$ {{ "%.2f"|format(ativo.depreciacao_mensal) }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            </div>
            {% if not ativos %}
            <div class="p-12 text-center">
                <svg class="mx-auto h-16 w-16 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
                <p class="text-gray-500 text-lg">Nenhum ativo cadastrado.</p>
                <a href="/ativos/novo" class="inline-block mt-4 text-green-600 hover:text-green-700 font-medium">
                    Cadastrar o primeiro ativo →
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
        `
    }
}
</script>
