            'bg-green-50 border-green-200 text-green-700': message.type === 'success',
            'bg-blue-50 border-blue-200 text-blue-700': message.type === 'info',

            'bg-red-50 border-red-200 text-red-700': message.type === 'error'
        }"

             x-show="message.show"

             x-transition:enter-start="opacity-0 transform translate-y-2"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 transform translate-y-0"
             x-transition:leave-end="opacity-0 transform translate-y-2">
            
            <div class="flex items-center">

                    <path x-show="message.type === 'error'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    <path x-show="message.type === 'info'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1m-1-2h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </template>
</div>

<script>
function messageSystem() {
    return {
        messages: [],
        
        showCurrentMessage() {
            if (this.messages.length > 0 && !this.messages[0].show) {
                this.messages[0].show = true;
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    this.closeMessage(0);
                }, 5000);
            }
        },
        
        addMessage(type, title, text, duration = 5000) {
            const message = {
                type,
                title,
                text,
                show: false,
                duration
            };
            
            this.messages.push(message);
        },
        
        closeMessage(index) {
            this.messages[index].show = false;
            setTimeout(() => {
                this.messages.splice(index, 1);
            }, 200);
        },
        
        // Convenience methods
        success(title, text) {
            this.addMessage('success', title, text);
        },
        
        error(title, text) {
            this.addMessage('error', title, text);
        },
        
        warning(title, text) {
            this.addMessage('warning', title, text);
        },
        
        info(title, text) {
            this.addMessage('info', title, text);
        }
    }
}
</script>

                    <svg x-show="sidebarOpen" x-cloak class="w-4 h-4 flex-shrink-0 transition-transform" :class="open ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                <div x-show="open && sidebarOpen" x-collapse x-cloak class="pl-10 space-y-0.5">
                    <a href="/web/configuracoes" class="block px-3 py-2 text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700/40 rounded-md transition-colors">Sistema</a>
                    <a href="/web/usuarios" class="block px-3 py-2 text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700/40 rounded-md transition-colors">Usuários</a>
                </div>
            </div>
        </nav>
    </aside>
    
    <!-- MAIN CONTENT -->
    <main-content class="flex-1 ml-0 mt-0 transition-all duration-300" :class="sidebarOpen ? 'ml-64' : 'ml-0'">
        <div class="pt-16">
            <div class="p-6">
                <!-- Page title -->
                                <!-- Breadcrumbs -->
                <nav aria-label="Breadcrumb" class="mb-6" x-data="breadcrumbSystem()">
                    <ol class="flex items-center space-x-1 text-sm">
                        <li>
                            <a href="/dashboard" class="text-gray-500 hover:text-gray-700">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                                </svg>
                            </a>
                            <span class="mx-2 text-gray-400">/</span>
                        </li>
                        <template x-for="(item, index) in breadcrumbs" :key="index">
                            <li>
                                <span x-show="index === breadcrumbs.length - 1" class="text-gray-900 dark:text-white font-medium" x-text="item.name"></span>
                                <template x-show="index < breadcrumbs.length - 1">
                                    <a :href="item.url" class="text-gray-500 hover:text-gray-700" x-text="item.name"></a>
                                    <span class="mx-2 text-gray-400">/</span>
                                </template>
                            </li>
                        </template>
                    </ol>
                </nav>
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-primary" x-text="pageTitle">Página</h1>
                    <p class="text-secondary mt-2" x-text="pageDescription">Descrição da página</p>
                </div>
                
                <!-- Flash messages -->
                <div x-show="showMessage" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0" class="mb-6">
                    <div :class="{
                        'bg-green-100 border-green-400 text-green-700': message.type === 'success',
                        'bg-blue-100 border-blue-400 text-blue-700': message.type === 'info',
                        'bg-yellow-100 border-yellow-400 text-yellow-700': message.type === 'warning',
                        'bg-red-100 border-red-400 text-red-700': message.type === 'error'
                    }" class="border-l-4 p-4 rounded">
                        <div class="flex items-center">
                            <svg class="w-6 h-6 mr-3" :fill="message.type === 'success' ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24">
                                <path x-show="message.type === 'success'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                <path x-show="message.type === 'error'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                <path x-show="message.type === 'info'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1m-1-2h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                <path x-show="message.type === 'warning'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            <div>
                                <h3 class="font-medium" x-text="message.title"></h3>
                                <p class="text-sm" x-text="message.text"></p>
                            </div>
                            <button @click="hideMessage()" class="ml-auto">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Page content -->
                <div x-show="!loading" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0">
                    <div x-html="pageContent"></div>
                </div>
                
                <!-- Loading state -->
                <div x-show="loading" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="text-center py-8">
                    <div class="inline-flex items-center">
                        <svg class="animate-spin h-8 w-8 text-primary" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="ml-3 text-secondary">Carregando...</span>
                    </div>
                </div>
            </div>
        </div>
    </main-content>
    
    <script>
        function appData() {
            return {
                // Theme management
                darkMode: false,
                sidebarOpen: true,
                
                // User data
                userName: 'Usuário',
                
                // Date and time
                currentDate: '',
                currentTime: '',
                
                // Page data
                pageTitle: 'Página',
                pageDescription: 'Descrição da página',
                pageContent: '',
                loading: false,
                
                // Message system
                showMessage: false,
                message: {
                    type: 'info',
                    title: '',
                    text: ''
                },
                
                initApp() {
                    // Initialize theme
                    this.isDark = window.vrtTheme?.isDark || false;
                    this.darkMode = this.isDark;
                    this.updateTheme();
                    
                    // Initialize sidebar state
                    this.sidebarOpen = localStorage.getItem('sidebarOpen') !== 'false';
                    this.$watch('sidebarOpen', value => localStorage.setItem('sidebarOpen', value));
                    
                    // Initialize date and time
                    this.updateDateTime();
                    setInterval(() => this.updateDateTime(), 1000);
                },
                
                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    if (window.vrtTheme) {
                        window.vrtTheme.toggle();
                        this.isDark = window.vrtTheme.isDark;
                    } else {
                        this.isDark = this.darkMode;
                    }
                    this.updateTheme();
                },
                
                updateTheme() {
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },
                
                updateDateTime() {
                    const now = new Date();
                    this.currentDate = now.toLocaleDateString('pt-BR', { 
                        weekday: 'long', 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                    });
                    this.currentTime = now.toLocaleTimeString('pt-BR', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });
                },
                
                showMessage(type, title, text) {
                    this.message = { type, title, text };
                    this.showMessage = true;
                    
                    // Auto-hide after 5 seconds
                    setTimeout(() => {
                        this.showMessage = false;
                    }, 5000);
                },
                
                hideMessage() {
                    this.showMessage = false;
                }
            }
        }
    
<script>
function loadingSystem() {
    return {
        isLoading: false,
        loadingText: 'Carregando...',
        
        start(text = 'Carregando...') {
            this.isLoading = true;
            this.loadingText = text;
        },
        
        stop() {
            this.isLoading = false;
        }
    }
}
</script>
</script>
</body>
</html>
