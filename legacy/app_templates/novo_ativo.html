{# extends "base.html" #}

{% extends 'base.html' %}


        <!-- Componentes Globais -->
        {% include "components/card.html" %}
        {% include "components/button.html" %}
        {% include "components/table.html" %}
        {% include "components/loading.html" %}
        {% include "components/message.html" %}
        {% include "components/empty-state.html" %}
        
<script>
function pageData() {
    return {
        pageTitle: 'Cadastro de Ativo Patrimonial',
        pageDescription: 'Cadastrar novo ativo patrimonial - Controle de bens e depreciação',
        breadcrumbs: [
            { name: 'Dashboard', url: '/dashboard' },
            { name: 'Ativos', url: '/ativos' },
            { name: 'Novo Ativo', url: '#' }
        ],
        pageContent: `
<div class="max-w-2xl mx-auto md:max-w-4xl lg:max-w-6xl">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">Cadastro de Ativo Patrimonial</h1>
                    <p class="text-secondary mt-2">Registro e controle de ativos e recursos do sistema.</p>

    <form method="POST" action="/ativos/novo" class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-6 space-y-5" class="space-y-6 md:space-y-8">
        <div>
            <label for="nome_bem" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Nome do Bem</label>
            <input type="text" id="nome_bem" name="nome_bem" required
                   class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" class="w-full px-4 py-2.5 md:px-6 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
        </div>

        <div>
            <label for="categoria" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Categoria</label>
            <select id="categoria" name="categoria" required
                    class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
                <option value="" disabled selected>Selecione a categoria</option>
                <option value="Veículo">Veículo</option>
                <option value="Equipamento">Equipamento</option>
                <option value="Imóvel">Imóvel</option>
                <option value="Ferramenta">Ferramenta</option>
            </select>
        </div>

        <div>
            <label for="valor_aquisicao" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Valor de Aquisição (R$)</label>
            <input type="number" id="valor_aquisicao" name="valor_aquisicao" step="0.01" min="0" required
                   class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" class="w-full px-4 py-2.5 md:px-6 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
        </div>

        <div>
            <label for="data_aquisicao" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Data de Aquisição</label>
            <input type="date" id="data_aquisicao" name="data_aquisicao" required
                   class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" class="w-full px-4 py-2.5 md:px-6 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
        </div>

        <div>
            <label for="vida_util_anos" class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">Vida Útil em Anos</label>
            <input type="number" id="vida_util_anos" name="vida_util_anos" min="1" required
                   class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100" class="w-full px-4 py-2.5 md:px-6 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100">
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
            <a href="/ativos"
               class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded transition">
                Cancelar
            </a>
            <button type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition" class="px-4 py-2 text-sm font-medium rounded-md"
                Salvar Ativo
            </button>
        </div>
    </form>
</div>
        `
    }
}
</script>
