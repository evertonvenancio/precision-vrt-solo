{% extends 'base.html' %}

<script>
function pageData() {
    return {
        pageTitle: 'Permissões de Acesso',
        pageDescription: 'Gerenciamento de permissões de usuário - Sistema de equipe',
        breadcrumbs: [
            { name: 'Dashboard', url: '/dashboard' },
            { name: 'Equipe', url: '/equipe' },
            { name: 'Permissões', url: '#' }
        ],
        pageContent: `
<div class="mb-6">
    <a href="/equipe" class="text-green-600 hover:text-green-700 font-medium text-sm mb-2 inline-block">
        ← Voltar para Equipe
    </a>
    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">Permissões de Acesso: <span class="text-green-600">{{ usuario.login }}</span></h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Gerenciamento de permissões e acessos ao sistema.</p>
    <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Marque as permissões que este usuário deve possuir. Permissões não marcadas serão negadas.</p>
</div>

<form method="POST" action="/equipe/{{ usuario.id }}/permissoes" class="space-y-6">

    <!-- Menu Principal -->
    <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-6">
        <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4 flex items-center">
            <svg class="w-5 h-5 mr-2 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
            Menu Principal
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-green-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="view_menu_inicio" value="true" {% if permissoes.get('view_menu_inicio') %}checked{% endif %} class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Ver Menu Início</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-green-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="view_menu_clientes" value="true" {% if permissoes.get('view_menu_clientes') %}checked{% endif %} class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Ver Menu Clientes</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-green-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="view_menu_recomendacao" value="true" {% if permissoes.get('view_menu_recomendacao') %}checked{% endif %} class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Ver Menu Recomendação</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-green-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="view_menu_conhecimento" value="true" {% if permissoes.get('view_menu_conhecimento') %}checked{% endif %} class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Ver Menu Conhecimento</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-green-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="view_menu_financeiro" value="true" {% if permissoes.get('view_menu_financeiro') %}checked{% endif %} class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Ver Menu Financeiro</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-green-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="view_menu_equipe" value="true" {% if permissoes.get('view_menu_equipe') %}checked{% endif %} class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Ver Menu Equipe</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-green-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="view_menu_configuracoes" value="true" {% if permissoes.get('view_menu_configuracoes') %}checked{% endif %} class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Ver Menu Configurações</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-green-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="view_menu_ativos" value="true" {% if permissoes.get('view_menu_ativos') %}checked{% endif %} class="w-5 h-5 text-green-600 rounded focus:ring-green-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Ver Menu Ativos</span>
            </label>
        </div>
    </div>

    <!-- Ações Técnicas -->
    <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-6">
        <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4 flex items-center">
            <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
            Ações Técnicas
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-blue-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="edit_clientes" value="true" {% if permissoes.get('edit_clientes') %}checked{% endif %} class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Editar Clientes</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-blue-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="edit_recomendacao" value="true" {% if permissoes.get('edit_recomendacao') %}checked{% endif %} class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Editar Recomendação</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-blue-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="edit_equipe" value="true" {% if permissoes.get('edit_equipe') %}checked{% endif %} class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Editar Equipe</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-blue-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="edit_financeiro" value="true" {% if permissoes.get('edit_financeiro') %}checked{% endif %} class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Editar Financeiro</span>
            </label>
        </div>
    </div>

    <!-- Configurações -->
    <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-6">
        <h3 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4 flex items-center">
            <svg class="w-5 h-5 mr-2 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Configurações Avançadas
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-purple-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="edit_config_precos" value="true" {% if permissoes.get('edit_config_precos') %}checked{% endif %} class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Editar Config. Preços</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-purple-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="edit_config_formulas" value="true" {% if permissoes.get('edit_config_formulas') %}checked{% endif %} class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Editar Config. Fórmulas</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-purple-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="edit_config_permissoes" value="true" {% if permissoes.get('edit_config_permissoes') %}checked{% endif %} class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Editar Config. Permissões</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-red-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="delete_registros" value="true" {% if permissoes.get('delete_registros') %}checked{% endif %} class="w-5 h-5 text-red-600 rounded focus:ring-red-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Excluir Registros</span>
            </label>
            <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 dark:border-gray-600 hover:bg-purple-50 dark:hover:bg-gray-700 cursor-pointer transition">
                <input type="checkbox" name="exportar_dados" value="true" {% if permissoes.get('exportar_dados') %}checked{% endif %} class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500">
                <span class="text-gray-700 dark:text-gray-200 font-medium">Exportar Dados</span>
            </label>
        </div>
    </div>

    <div class="flex items-center justify-between pt-4">
        <a href="/equipe" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 font-medium px-4 py-2">
            Cancelar
        </a>
        <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow transition flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            Salvar Permissões
        </button>
    </div>
</form>
        `
    }
}
</script>
