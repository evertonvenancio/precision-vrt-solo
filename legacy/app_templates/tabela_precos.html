{# extends "base.html" #}

{% extends 'base.html' %}


        <!-- Componentes Globais -->
        {% include "components/card.html" %}
        {% include "components/button.html" %}
        {% include "components/table.html" %}
        {% include "components/loading.html" %}
        {% include "components/message.html" %}
        {% include "components/empty-state.html" %}
        
<script>
function pageData() {
    return {
        pageTitle: 'Tabela de Preços e Serviços',
        pageDescription: 'Gerencie os serviços oferecidos e seus valores base.',
        breadcrumbs: [
            { name: 'Dashboard', url: '/dashboard' },
            { name: 'Financeiro', url: '/financeiro' },
            { name: 'Tabela de Preços', url: '#' }
        ],
        pageContent: `
<div class="h-full flex flex-col" x-data="pageData()">

    <!-- CABEÇALHO FIXO -->
    <div class="flex-shrink-0 px-8 pt-6 pb-4 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Tabela de Preços e Serviços</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Gerenciamento de tabelas de preços e custos de insumos agrícolas.</p>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Gerenciamento de tabelas de preços e custos de insumos agrícolas.</p>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Gerencie os serviços oferecidos e seus valores base.</p>
            </div>
            <a href="/cadastros/precos/novo"
               class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition flex items-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Novo Serviço
            </a>
        </div>
    </div>

    <!-- CENTRO SCROLLÁVEL -->
    <div class="flex-1 overflow-y-auto p-8">
        <div class="bg-white dark:bg-gray-800 shadow-md rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <div class="overflow-x-auto">
            \1
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-700 text-gray-500 dark:text-gray-300 text-xs font-medium uppercase tracking-wider">
                            <th class="px-6 py-3">Nome do Serviço</th>
                            <th class="px-6 py-3">Unidade</th>
                            <th class="px-6 py-3">Preço Base (R$)</th>
                            <th class="px-6 py-3 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                        {% if servicos %}
                            {% for svc in servicos %}
                            <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition">
                                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100 font-medium">{{ svc.nome }}</td>
                                <td class="px-6 py-4">
                                    <span class="px-2 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300">
                                        {{ svc.unidade }}
                                    </span>
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-900 dark:text-gray-100 font-mono font-medium">R$ {{ "%.2f"|format(svc.preco_base) }}</td>
                                <td class="px-6 py-4 text-center">
                                    <div class="flex items-center justify-center gap-2">
                                        <a href="/cadastros/precos/{{ svc.id }}/editar"
                                           class="inline-flex items-center text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300 text-sm font-medium transition"
                                           title="Editar">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                        </a>
                                        <a href="/cadastros/precos/{{ svc.id }}/excluir"
                                           class="inline-flex items-center text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 text-sm font-medium transition"
                                           title="Excluir"
                                           onclick="return confirm('Tem certeza que deseja excluir este serviço?')">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="4" class="px-6 py-12 text-center">
                                    <svg class="mx-auto h-16 w-16 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                              d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                                    </svg>
                                    <p class="text-gray-500 text-lg">Nenhum serviço cadastrado.</p>
                                    <a href="/cadastros/precos/novo" class="inline-block mt-4 text-green-600 hover:text-green-700 font-medium">
                                        Cadastrar o primeiro serviço →
                                    </a>
                                </td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
            </div>
        </div>
    </div>

</div>
        `
    }
}
</script>
