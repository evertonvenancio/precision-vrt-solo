<!-- Sistema de empty states -->
<div x-data="emptyState()" class="text-center py-12">
    <!-- Empty state with icon -->
    <div class="space-y-4">
        <!-- Icon container -->
        <div class="mx-auto w-24 h-24 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center">
            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
            </svg>
        </div>
        
        <!-- Title and description -->
        <div>
            <h3 class="text-lg font-medium text-gray-900 dark:text-white" x-text="title">Nenhum item encontrado</h3>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400" x-text="description">Não há itens para exibir no momento.</p>
        </div>
        
        <!-- Action button -->
        <div x-show="showButton" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0">
            <button @click="$emit('action')" class="btn-primary px-4 py-2 rounded-lg font-medium transition-colors hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span x-text="buttonText || 'Adicionar primeiro item'">Adicionar primeiro item</span>
            </button>
        </div>
    </div>
</div>

<script>
function emptyState() {
    return {
        title: 'Nenhum item encontrado',
        description: 'Não há itens para exibir no momento.',
        buttonText: 'Adicionar primeiro item',
        showButton: true
    }
}
</script>
